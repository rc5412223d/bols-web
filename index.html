<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft 無垠伺服器</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap');

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
    font-family: "Noto Sans TC", system-ui, sans-serif;
    color: #fff;
    background:
        linear-gradient(180deg, rgba(0,0,0,.12), rgba(0,0,0,.72)),
        url("minecraft_bg.png") center/cover fixed no-repeat;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 42px 18px;
}

.container {
    width: min(980px, 100%);
    text-align: center;
}

.badge {
    display: inline-block;
    padding: 10px 25px;
    border: 2px solid rgba(150,255,70,.8);
    border-radius: 12px;
    background: rgba(15,25,12,.82);
    box-shadow: 0 0 24px rgba(100,255,50,.25);
    font-weight: 900;
    font-size: clamp(18px, 4vw, 27px);
    margin-bottom: 18px;
}

h1 {
    margin: 0;
    font-size: clamp(42px, 9vw, 88px);
    line-height: .95;
    font-weight: 900;
    letter-spacing: 2px;
    color: #9cff38;
    text-shadow:
        0 5px 0 #244d0c,
        0 9px 18px rgba(0,0,0,.9);
}

.subtitle {
    margin: 16px 0 32px;
    font-size: clamp(16px, 3vw, 22px);
    font-weight: 700;
    text-shadow: 2px 3px 5px #000;
}

.card {
    text-align: left;
    margin: 16px 0;
    padding: 23px 28px;
    background: rgba(5, 12, 10, .88);
    border: 2px solid #82e63a;
    border-radius: 16px;
    box-shadow: 0 8px 30px rgba(0,0,0,.45), inset 0 0 25px rgba(100,255,60,.06);
    backdrop-filter: blur(4px);
    transition: transform .2s, box-shadow .2s;
}

.card:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 35px rgba(0,0,0,.55), 0 0 25px rgba(100,255,60,.18);
}

.card.blue { border-color: #35aaff; }
.card.purple { border-color: #c56cff; }

.label {
    font-size: 18px;
    font-weight: 900;
    margin-bottom: 7px;
}

.value {
    font-size: clamp(18px, 3.5vw, 27px);
    font-weight: 800;
    word-break: break-all;
}

.green { color: #9cff38; }
.blue-text { color: #5fc2ff; }
.purple-text { color: #d08aff; }

a {
    color: inherit;
    text-decoration: none;
}
a:hover { text-decoration: underline; }

.discord {
    display: inline-block;
    margin-top: 18px;
    padding: 14px 28px;
    border-radius: 12px;
    background: #5865f2;
    color: white;
    font-size: 18px;
    font-weight: 900;
    box-shadow: 0 6px 18px rgba(0,0,0,.4);
    transition: transform .2s, filter .2s;
}
.discord:hover {
    transform: translateY(-2px);
    filter: brightness(1.12);
    text-decoration: none;
}

footer {
    margin-top: 30px;
    padding: 14px;
    font-weight: 700;
    text-shadow: 2px 2px 5px #000;
    opacity: .95;
}

@media (max-width: 600px) {
    body { padding: 25px 12px; }
    .card { padding: 18px; }
}
</style>
</head>

<body>
<main class="container">
    <div class="badge">🌿 歡迎來到</div>

    <h1>MINECRAFT<br>無垠伺服器</h1>

    <div class="subtitle">
        一起在無垠的世界中，創造屬於我們的故事！
    </div>

    <section class="card">
        <div class="label">🖥️ 伺服器主機</div>
        <div class="value">
            伺服器選用 <span class="green">Cheapserver</span> 便宜伺服的高階主機
        </div>
    </section>

    <section class="card blue">
        <div class="label blue-text">🗺️ BlueMap 網址</div>
        <div class="value">
            <a class="blue-text" href="http://tw-6.cs-nodes.net:30723" target="_blank">
                http://tw-6.cs-nodes.net:30723
            </a>
        </div>
    </section>

    <section class="card">
        <div class="label green">⛏️ Minecraft IP</div>
        <div class="value">bols.mysmp.cc</div>
    </section>

    <section class="card purple">
        <div class="label purple-text">💬 Discord 社群</div>
        <div class="value">
            <a class="purple-text" href="https://discord.gg/ucMJ35Qk55" target="_blank">
                discord.gg/ucMJ35Qk55
            </a>
        </div>
        <a class="discord" href="https://discord.gg/ucMJ35Qk55" target="_blank">
            加入我們的 Discord
        </a>
    </section>

    <footer>◆ 無垠伺服器 ◆ 歡迎你的加入 ◆</footer>
</main>
</body>
</html>
