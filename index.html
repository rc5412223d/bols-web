<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft 無垠伺服器</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  font-family:
    "Segoe UI",
    "Microsoft JhengHei",
    "Noto Sans TC",
    sans-serif;
  background: #071009;
  color: #eee;
}

body {
  min-height: 100vh;
  overflow: hidden;
}

/* =========================================================
   Minecraft 背景
========================================================= */

body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -10;

  background-image:
    linear-gradient(
      rgba(3, 8, 5, 0.70),
      rgba(3, 8, 5, 0.82)
    ),
    url("minecraft_bg.png");

  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

/* =========================================================
   Header
========================================================= */

.header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 70px;

  display: flex;
  align-items: center;
  gap: 18px;

  padding: 0 32px;

  background: rgba(8, 14, 10, 0.94);
  border-bottom: 1px solid rgba(255,255,255,0.10);

  backdrop-filter: blur(12px);

  z-index: 1000;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;

  font-size: 23px;
  font-weight: 800;

  color: #f3f3f3;

  white-space: nowrap;
}

.logo-icon {
  width: 40px;
  height: 40px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 8px;

  background: #43a047;

  font-size: 23px;

  box-shadow:
    inset 0 -3px rgba(0,0,0,0.25),
    0 4px 12px rgba(0,0,0,0.35);
}

.nav {
  margin-left: auto;

  display: flex;
  align-items: center;
  gap: 8px;
}

.nav button,
.nav a {
  border: 0;
  text-decoration: none;

  color: #eee;

  background: transparent;

  padding: 11px 15px;

  border-radius: 9px;

  font-size: 15px;

  cursor: pointer;

  transition:
    background 0.15s,
    transform 0.15s;
}

.nav button:hover,
.nav a:hover {
  background: rgba(255,255,255,0.08);
}

.nav .active {
  background: rgba(46, 125, 50, 0.45);
}

.user-box {
  display: flex;
  align-items: center;
  gap: 8px;

  margin-left: 3px;
}

.user-avatar {
  width: 36px;
  height: 36px;

  border-radius: 50%;

  object-fit: cover;

  background: #444;

  border: 2px solid rgba(255,255,255,0.18);
}

.user-name {
  max-width: 130px;

  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;

  color: #eee;
  font-size: 14px;
}

.logout-btn {
  background: rgba(255,255,255,0.06) !important;
  border: 1px solid rgba(255,255,255,0.14) !important;
}

/* =========================================================
   Page
========================================================= */

.main {
  position: fixed;

  top: 70px;
  left: 0;
  right: 0;
  bottom: 0;

  overflow: hidden;
}

.page {
  position: absolute;

  inset: 0;

  display: none;

  overflow: hidden;

  padding: 28px 32px;
}

.page.active {
  display: block;
}

/* =========================================================
   Home
========================================================= */

.home-container {
  width: min(1100px, 100%);
  margin: 0 auto;

  height: 100%;

  overflow-y: auto;

  padding: 25px 10px 80px;

  scrollbar-width: thin;
  scrollbar-color: #3d6d43 transparent;
}

.hero {
  padding: 55px 35px;

  border-radius: 18px;

  background:
    linear-gradient(
      135deg,
      rgba(24, 72, 30, 0.86),
      rgba(8, 20, 12, 0.90)
    );

  border: 1px solid rgba(255,255,255,0.10);

  box-shadow:
    0 20px 60px rgba(0,0,0,0.30);

  text-align: center;
}

.hero h1 {
  margin: 0 0 15px;

  font-size: clamp(32px, 5vw, 56px);

  text-shadow:
    0 4px 0 #111,
    0 8px 20px rgba(0,0,0,0.45);
}

.hero p {
  margin: 0;

  color: #c8d0c9;

  font-size: 17px;
}

.home-grid {
  display: grid;

  grid-template-columns:
    repeat(auto-fit, minmax(230px, 1fr));

  gap: 18px;

  margin-top: 22px;
}

.info-card {
  padding: 24px;

  border-radius: 15px;

  background: rgba(9, 18, 12, 0.88);

  border: 1px solid rgba(255,255,255,0.08);

  box-shadow:
    0 12px 35px rgba(0,0,0,0.20);
}

.info-card h3 {
  margin: 0 0 13px;

  color: #8de39a;
}

.info-value {
  color: #eee;

  word-break: break-word;

  line-height: 1.7;
}

.status-online {
  color: #4caf50;
  font-weight: 700;
}

.info-link {
  color: #64b5f6;
  word-break: break-all;
}

/* =========================================================
   Chat
========================================================= */

.chat-page {
  padding: 15px 18px;
}

.chat-shell {
  width: min(1250px, 100%);

  height: 100%;

  margin: 0 auto;

  display: flex;

  background: rgba(6, 12, 8, 0.92);

  border: 1px solid rgba(255,255,255,0.10);

  border-radius: 17px;

  overflow: hidden;

  box-shadow:
    0 20px 60px rgba(0,0,0,0.35);
}

.chat-sidebar {
  width: 220px;

  flex: 0 0 220px;

  background: rgba(5, 12, 8, 0.94);

  border-right: 1px solid rgba(255,255,255,0.08);

  padding: 18px 12px;
}

.chat-sidebar-title {
  padding: 5px 10px 15px;

  color: #9ca69e;

  font-size: 12px;

  font-weight: 700;

  letter-spacing: 1px;
}

.channel-btn {
  width: 100%;

  border: 0;

  background: transparent;

  color: #aaa;

  text-align: left;

  padding: 13px 12px;

  margin-bottom: 5px;

  border-radius: 9px;

  cursor: pointer;

  font-size: 14px;

  transition:
    background 0.15s,
    color 0.15s;
}

.channel-btn:hover {
  background: rgba(255,255,255,0.06);

  color: #fff;
}

.channel-btn.active {
  background: rgba(46,125,50,0.40);

  color: #fff;
}

.chat-main {
  min-width: 0;

  flex: 1;

  display: flex;

  flex-direction: column;

  overflow: hidden;
}

.chat-header {
  height: 58px;

  flex: 0 0 58px;

  display: flex;

  align-items: center;

  padding: 0 18px;

  border-bottom: 1px solid rgba(255,255,255,0.08);

  background: rgba(10,18,12,0.92);
}

.chat-header-title {
  font-weight: 700;
}

.chat-header-status {
  margin-left: auto;

  color: #777;

  font-size: 12px;
}

/* 重要：只有這裡可以上下滑 */

.messages {
  flex: 1;

  min-height: 0;

  overflow-y: auto;
  overflow-x: hidden;

  padding: 18px 18px 15px;

  scrollbar-width: thin;

  scrollbar-color:
    rgba(120,150,125,0.7)
    rgba(0,0,0,0.15);

  overscroll-behavior: contain;
}

.messages::-webkit-scrollbar {
  width: 9px;
}

.messages::-webkit-scrollbar-track {
  background: rgba(0,0,0,0.15);
}

.messages::-webkit-scrollbar-thumb {
  background: rgba(120,150,125,0.55);

  border-radius: 10px;
}

.message {
  display: flex;

  gap: 11px;

  margin-bottom: 16px;

  min-width: 0;
}

.message-avatar {
  width: 38px;
  height: 38px;

  flex: 0 0 38px;

  border-radius: 50%;

  object-fit: cover;

  background: #3c3c3c;

  border: 1px solid rgba(255,255,255,0.13);
}

.message-content {
  min-width: 0;

  flex: 1;
}

.message-top {
  display: flex;

  align-items: baseline;

  gap: 8px;

  margin-bottom: 3px;
}

.message-name {
  color: #64ff7a;

  font-weight: 700;

  font-size: 14px;
}

.message-time {
  color: #777;

  font-size: 11px;
}

.message-text {
  color: #e8e8e8;

  white-space: pre-wrap;

  overflow-wrap: anywhere;

  line-height: 1.55;

  font-size: 14px;
}

.file-card {
  display: inline-flex;

  align-items: center;

  gap: 8px;

  max-width: min(100%, 520px);

  margin-top: 6px;

  padding: 9px 12px;

  border-radius: 9px;

  background: rgba(40,50,44,0.82);

  border: 1px solid rgba(255,255,255,0.10);
}

.file-card a {
  color: #64b5f6;

  text-decoration: none;

  overflow-wrap: anywhere;
}

.file-card a:hover {
  text-decoration: underline;
}

.chat-input-area {
  flex: 0 0 auto;

  display: flex;

  gap: 8px;

  padding: 12px 13px;

  border-top: 1px solid rgba(255,255,255,0.08);

  background: rgba(7,13,9,0.96);
}

.file-button {
  flex: 0 0 auto;

  border: 0;

  border-radius: 8px;

  background: #2c302d;

  color: #eee;

  padding: 0 14px;

  cursor: pointer;

  font-size: 14px;
}

.file-button:hover {
  background: #3b403c;
}

.chat-input {
  min-width: 0;

  flex: 1;

  height: 44px;

  padding: 0 13px;

  border-radius: 8px;

  border: 1px solid rgba(255,255,255,0.12);

  outline: none;

  background: rgba(0,0,0,0.30);

  color: #fff;

  font-size: 14px;
}

.chat-input:focus {
  border-color: rgba(76,175,80,0.7);
}

.send-button {
  flex: 0 0 auto;

  height: 44px;

  border: 0;

  border-radius: 8px;

  padding: 0 18px;

  background: #43a047;

  color: white;

  font-weight: 700;

  cursor: pointer;
}

.send-button:hover {
  background: #4caf50;
}

.chat-login {
  width: min(600px, 100%);

  margin: 70px auto;

  padding: 45px 30px;

  border-radius: 16px;

  text-align: center;

  background: rgba(8,17,11,0.91);

  border: 1px solid rgba(255,255,255,0.10);
}

.chat-login h2 {
  margin-top: 0;
}

.login-button {
  border: 0;

  padding: 13px 22px;

  border-radius: 9px;

  background: #4285f4;

  color: white;

  cursor: pointer;

  font-weight: 700;
}

/* =========================================================
   Voice
========================================================= */

.voice-page {
  overflow-y: auto;
}

.voice-shell {
  width: min(850px, 100%);

  margin: 20px auto;

  padding: 30px;

  border-radius: 18px;

  background: rgba(7,15,9,0.92);

  border: 1px solid rgba(255,255,255,0.10);

  box-shadow:
    0 20px 60px rgba(0,0,0,0.32);
}

.voice-title {
  text-align: center;

  margin-bottom: 25px;
}

.voice-icon {
  font-size: 50px;
}

.voice-room {
  display: flex;

  align-items: center;

  justify-content: space-between;

  padding: 17px 20px;

  border-radius: 12px;

  background: rgba(25,35,28,0.9);

  border: 1px solid rgba(255,255,255,0.08);
}

.voice-room-name {
  font-weight: 700;
}

.voice-status {
  color: #888;

  font-size: 13px;
}

.voice-controls {
  display: flex;

  flex-wrap: wrap;

  gap: 10px;

  margin-top: 20px;
}

.voice-btn {
  border: 0;

  border-radius: 9px;

  padding: 11px 17px;

  background: #333;

  color: white;

  cursor: pointer;
}

.voice-btn:hover {
  background: #444;
}

.voice-btn.green {
  background: #43a047;
}

.voice-btn.red {
  background: #b71c1c;
}

.voice-participants {
  margin-top: 25px;
}

.voice-participants h3 {
  margin-bottom: 12px;
}

.participant {
  display: flex;

  align-items: center;

  gap: 10px;

  padding: 9px 10px;

  margin-bottom: 6px;

  border-radius: 8px;

  background: rgba(255,255,255,0.035);
}

.participant img {
  width: 34px;
  height: 34px;

  border-radius: 50%;

  object-fit: cover;

  background: #444;
}

.participant-name {
  font-size: 14px;
}

/* =========================================================
   Notice
========================================================= */

.notice {
  position: fixed;

  left: 50%;

  bottom: 25px;

  transform: translateX(-50%) translateY(20px);

  z-index: 9999;

  padding: 11px 18px;

  border-radius: 9px;

  background: rgba(20,25,21,0.96);

  border: 1px solid rgba(255,255,255,0.12);

  color: white;

  opacity: 0;

  pointer-events: none;

  transition:
    opacity 0.2s,
    transform 0.2s;
}

.notice.show {
  opacity: 1;

  transform:
    translateX(-50%)
    translateY(0);
}

/* =========================================================
   Mobile
========================================================= */

@media (max-width: 760px) {

  .header {
    padding: 0 12px;

    gap: 7px;
  }

  .logo {
    font-size: 16px;
  }

  .logo-icon {
    width: 34px;
    height: 34px;

    font-size: 18px;
  }

  .user-name {
    display: none;
  }

  .nav button,
  .nav a {
    padding: 9px 9px;

    font-size: 13px;
  }

  .chat-page {
    padding: 7px;
  }

  .chat-sidebar {
    width: 145px;

    flex-basis: 145px;
  }

  .messages {
    padding: 12px 10px;
  }

  .chat-input-area {
    padding: 9px;
  }

  .file-button {
    padding: 0 10px;
  }

  .send-button {
    padding: 0 13px;
  }

  .home-container {
    padding-left: 3px;
    padding-right: 3px;
  }

  .hero {
    padding: 35px 20px;
  }
}
</style>
</head>

<body>

<!-- =========================================================
     Header
========================================================= -->

<header class="header">

  <div class="logo">
    <div class="logo-icon">⛏️</div>
    <span>Minecraft 無垠伺服器</span>
  </div>

  <nav class="nav">

    <button
      type="button"
      id="nav-home"
      class="active"
    >
      首頁
    </button>

    <button
      type="button"
      id="nav-chat"
    >
      💬 聊天
    </button>

    <button
      type="button"
      id="nav-voice"
    >
      🎙️ 語音
    </button>

    <button
      type="button"
      id="loginNav"
    >
      登入
    </button>

    <div
      class="user-box"
      id="userBox"
      style="display:none;"
    >

      <img
        id="userAvatar"
        class="user-avatar"
        src=""
        alt="頭像"
      >

      <span
        id="userName"
        class="user-name"
      >
        玩家
      </span>

      <button
        type="button"
        id="logoutBtn"
        class="logout-btn"
      >
        登出
      </button>

    </div>

  </nav>

</header>

<!-- =========================================================
     Main
========================================================= -->

<main class="main">

  <!-- =======================================================
       HOME
  ======================================================== -->

  <section
    id="page-home"
    class="page active"
  >

    <div class="home-container">

      <div class="hero">

        <h1>Minecraft 無垠伺服器</h1>

        <p>
          歡迎來到 Minecraft 無垠伺服器
        </p>

      </div>

      <div class="home-grid">

        <div class="info-card">

          <h3>🟢 伺服器狀態</h3>

          <div class="info-value">
            <span class="status-online">
              ● 在線
            </span>
          </div>

        </div>

        <div class="info-card">

          <h3>🎮 Minecraft IP</h3>

          <div class="info-value">
            mc.bols.dpdns.org
          </div>

        </div>

        <div class="info-card">

          <h3>🗺️ BlueMap</h3>

          <div class="info-value">

            <a
              class="info-link"
              href="http://tw-6.cs-nodes.net:30723"
              target="_blank"
              rel="noopener"
            >
              http://tw-6.cs-nodes.net:30723
            </a>

          </div>

        </div>

        <div class="info-card">

          <h3>💬 Discord</h3>

          <div class="info-value">

            <a
              class="info-link"
              href="https://discord.gg/ucMJ35Qk55"
              target="_blank"
              rel="noopener"
            >
              加入 Discord
            </a>

          </div>

        </div>

      </div>

    </div>

  </section>

  <!-- =======================================================
       CHAT
  ======================================================== -->

  <section
    id="page-chat"
    class="page chat-page"
  >

    <div
      id="chatLogin"
      class="chat-login"
    >

      <h2>💬 聊天室</h2>

      <p>
        請先使用 Google 登入後才能使用聊天室。
      </p>

      <button
        type="button"
        id="chatLoginBtn"
        class="login-button"
      >
        使用 Google 登入
      </button>

    </div>

    <div
      id="chatShell"
      class="chat-shell"
      style="display:none;"
    >

      <aside class="chat-sidebar">

        <div class="chat-sidebar-title">
          聊天頻道
        </div>

        <button
          type="button"
          class="channel-btn active"
          data-channel="server"
        >
          💬 伺服器聊天
        </button>

        <button
          type="button"
          class="channel-btn"
          data-channel="litematica"
        >
          🧱 Litematica
        </button>

        <button
          type="button"
          class="channel-btn"
          data-channel="announcement"
        >
          📢 公告
        </button>

      </aside>

      <section class="chat-main">

        <div class="chat-header">

          <span
            id="chatTitle"
            class="chat-header-title"
          >
            💬 伺服器聊天
          </span>

          <span
            id="chatConnection"
            class="chat-header-status"
          >
            連線中...
          </span>

        </div>

        <!--
          重要：
          只有 messages 本身可以上下滑。
          body/main/page 都不會跟著聊天內容一起滑。
        -->

        <div
          id="messages"
          class="messages"
        ></div>

        <form
          id="chatForm"
          class="chat-input-area"
        >

          <input
            id="fileInput"
            type="file"
            style="display:none;"
          >

          <button
            type="button"
            id="fileBtn"
            class="file-button"
          >
            📎 檔案
          </button>

          <input
            id="chatInput"
            class="chat-input"
            type="text"
            maxlength="2000"
            autocomplete="off"
            placeholder="輸入訊息......"
          >

          <button
            type="submit"
            class="send-button"
          >
            傳送
          </button>

        </form>

      </section>

    </div>

  </section>

  <!-- =======================================================
       VOICE
  ======================================================== -->

  <section
    id="page-voice"
    class="page voice-page"
  >

    <div class="voice-shell">

      <div class="voice-title">

        <div class="voice-icon">
          🎙️
        </div>

        <h2>
          語音頻道
        </h2>

        <p>
          目前只有一個語音頻道：大廳
        </p>

      </div>

      <div class="voice-room">

        <div>

          <div class="voice-room-name">
            🔊 大廳
          </div>

          <div
            id="voiceStatus"
            class="voice-status"
          >
            尚未加入
          </div>

        </div>

        <div id="voiceCount">
          0 人
        </div>

      </div>

      <div class="voice-controls">

        <button
          type="button"
          id="joinVoiceBtn"
          class="voice-btn green"
        >
          🎙️ 加入語音
        </button>

        <button
          type="button"
          id="leaveVoiceBtn"
          class="voice-btn red"
          disabled
        >
          🚪 離開語音
        </button>

        <button
          type="button"
          id="muteBtn"
          class="voice-btn"
          disabled
        >
          🎤 麥克風：開
        </button>

        <button
          type="button"
          id="soundBtn"
          class="voice-btn"
        >
          🔊 啟用聲音
        </button>

      </div>

      <div class="voice-participants">

        <h3>
          語音中的玩家
        </h3>

        <div
          id="voiceParticipants"
        >
          <div
            style="color:#777;"
          >
            尚未有人加入
          </div>
        </div>

      </div>

    </div>

  </section>

</main>

<div
  id="notice"
  class="notice"
></div>

<!-- =========================================================
     JavaScript
========================================================= -->

<script>
"use strict";

/* =========================================================
   基本設定
========================================================= */

const WORKER_URL =
  "https://auth.bols.dpdns.org";

const SITE_URL =
  "https://bols.dpdns.org";

const CHANNEL_NAMES = {
  server: "💬 伺服器聊天",
  litematica: "🧱 Litematica",
  announcement: "📢 公告"
};

/*
 * WebRTC STUN。
 * 它只負責協助兩台裝置找到彼此，
 * 不會把語音傳到 Google。
 */

const ICE_SERVERS = [
  {
    urls: "stun:stun.l.google.com:19302"
  },
  {
    urls: "stun:stun.cloudflare.com:3478"
  }
];

/* =========================================================
   DOM
========================================================= */

const pageHome =
  document.getElementById("page-home");

/* =========================================================

========================================================= */

function showNotice(text) {

  notice.textContent = text;

  notice.classList.add("show");

  clearTimeout(noticeTimer);

  noticeTimer = setTimeout(() => {

    notice.classList.remove("show");

  }, 2600);
}

/* =========================================================
   頁面切換
========================================================= */

function showPage(name) {

  pageHome.classList.remove("active");
  pageChat.classList.remove("active");
  pageVoice.classList.remove("active");

  navHome.classList.remove("active");
  navChat.classList.remove("active");
  navVoice.classList.remove("active");

  if (name === "home") {

    pageHome.classList.add("active");
    navHome.classList.add("active");

  }

  if (name === "chat") {

    pageChat.classList.add("active");
    navChat.classList.add("active");

    if (currentUser) {

      loadChatHistory();

      /*
       * 等 DOM 完成後，
       * 把聊天內部捲軸移到最下面。
       */

      setTimeout(() => {
        scrollMessages(true);
      }, 80);

    }

  }

  if (name === "voice") {

    pageVoice.classList.add("active");
    navVoice.classList.add("active");

  }
}

function setLoggedIn(user) {

  currentUser = user || null;

  if (!currentUser) {

    setLoggedOut();

    return;

  }

  const picture =
    currentUser.picture ||
    currentUser.avatar ||
    fallbackAvatar();

  const name =
    currentUser.name ||
    currentUser.email ||

  userAvatar.src = picture;

  userAvatar.onerror = () => {

async function checkLogin() {

  try {

    const response =
      await fetch(
        `${WORKER_URL}/me`,
        {
          method: "GET",
          credentials: "include",
          cache: "no-store"
        }
      );

    if (!response.ok) {

      setLoggedOut();

      return;

    }

    const data =
      await response.json();

    const user =
      data.user ||
      data;

    if (
      data.loggedIn === false ||
      !user ||
      (
        data.ok === false &&
        !data.user
      )
    ) {

      setLoggedOut();

      return;

    }

    setLoggedIn(user);

    if (
      currentUser &&
      pageChat.classList.contains("active")
    ) {

      await loadChatHistory();

    }

  } catch (error) {

    console.error(
      "Login check error:",
      error
    );

    setLoggedOut();

  }

}

/* =========================================================
   Chat history
========================================================= */

async function loadChatHistory() {

  if (!currentUser) {
    return;
  }

  messages.innerHTML = "";

  chatConnection.textContent =
    "讀取訊息...";

  try {

    const response =
      await fetch(
        `${WORKER_URL}/api/chat?channel=${encodeURIComponent(currentChannel)}`,
        {
          method: "GET",
          credentials: "include",
          cache: "no-store"
        }
      );

    if (
      response.status === 401
    ) {

      setLoggedOut();

      showNotice(
        "登入已失效，請重新登入。"
      );

      return;

    }

    const data =
      await response.json();

    const list =
      Array.isArray(data)
        ? data
        : (
          data.messages ||
          data.data ||
          []
        );

    messages.innerHTML = "";

    for (
      const item of list
    ) {

      renderMessage(
        normalizeMessage(item),
        false
      );

    }

    /*
     * 這裡只捲「聊天室內部」。
     * 不會捲動瀏覽器整個頁面。
     */

    requestAnimationFrame(() => {

      scrollMessages(true);

    });

    chatConnection.textContent =
      "已連線";

  } catch (error) {

    console.error(
      "Chat history error:",
      error
    );

    chatConnection.textContent =
      "讀取失敗";

    showNotice(
      "聊天紀錄讀取失敗"
    );

  }

}

/* =========================================================
   Chat WebSocket
========================================================= */

function closeChatSocket() {

  if (chatSocket) {

    try {
      chatSocket.close();
    } catch {}

    chatSocket = null;

  }

}

function connectChatSocket() {

  if (!currentUser) {
    return;
  }

  closeChatSocket();

  const generation =
    ++chatSocketGeneration;

  const wsUrl =
    `${WORKER_URL.replace(/^http/, "ws")}` +
    `/api/chat/ws?channel=` +
    encodeURIComponent(currentChannel);

  chatConnection.textContent =
    "連線中...";

  try {

    chatSocket =
      new WebSocket(wsUrl);

  } catch (error) {

    console.error(
      "WebSocket create error:",
      error
    );

    chatConnection.textContent =
      "連線失敗";

    return;

  }

  chatSocket.addEventListener(
    "open",
    () => {

      if (
        generation !==
        chatSocketGeneration
      ) {
        return;
      }

      chatConnection.textContent =
        "已連線";

    }
  );

  chatSocket.addEventListener(
    "message",
    event => {

      if (
        generation !==
        chatSocketGeneration
      ) {
        return;
      }

      try {

        const raw =
          JSON.parse(
            event.data
          );

        console.log(
          "CHAT WS:",
          raw
        );

        /*
         * Worker 目前聊天訊息可能直接是：
         *
         * {
         *   id,
         *   channel,
         *   text,
         *   user,
         *   createdAt
         * }
         *
         * 也兼容：
         *
         * {
         *   type: "message",
         *   message: {...}
         * }
         */

        let data =
          raw;

        if (
          raw &&
          raw.type === "message" &&
          raw.message
        ) {

          data =
            raw.message;

        }

        const message =
          normalizeMessage(data);

        if (
          !message.text &&
          !message.attachment
        ) {

          return;

        }

        /*
         * 如果目前不在這個頻道，
         * 不顯示。
         */

        if (
          message.channel &&
          message.channel !==
            currentChannel
        ) {

          return;

        }

        /*
         * REST POST 成功後可能已經
         * 顯示一次，因此用 id 防重複。
         */

        if (
          message.id &&
          document.querySelector(
            `[data-message-id="${CSS.escape(message.id)}"]`
          )
        ) {

          return;

        }

        renderMessage(
          message,
          true
        );

      } catch (error) {

        console.error(
          "Chat WebSocket message error:",
          error
        );

      }

    }
  );

  chatSocket.addEventListener(
    "close",
    () => {

      if (
        generation !==
        chatSocketGeneration
      ) {
        return;
      }

      chatConnection.textContent =
        "已斷線";

      /*
       * 3 秒後嘗試重連。
       */

      setTimeout(() => {

        if (
          currentUser &&
          generation ===
            chatSocketGeneration
        ) {

          connectChatSocket();

        }

      }, 3000);

    }
  );

  chatSocket.addEventListener(
    "error",
    error => {

      console.error(
        "Chat WebSocket error:",
        error
      );

      chatConnection.textContent =
        "連線錯誤";

    }
  );

}

/* =========================================================
   Message normalize
========================================================= */

function normalizeMessage(data) {

  if (!data) {

    return {
      id: "",
      text: "",
      channel: currentChannel,
      createdAt: Date.now(),
      user: {}
    };

  }

  if (
    data.message &&
    typeof data.message ===
      "object"
  ) {

    data =
      data.message;

  }

  let user =
    data.user ||
    data.author ||
    {};

  if (
    typeof user === "string"
  ) {

    user = {
      name: user
    };

  }

  const text =
    data.text !== undefined
      ? String(data.text)
      : (
        typeof data.message ===
        "string"
          ? data.message
          : ""
      );

  const attachment =
    data.attachment ||
    data.file ||
    (
      data.fileUrl
        ? {
          name:
            data.fileName ||
            "檔案",
          url:
            data.fileUrl
        }
        : null
    );

  return {

    id:
      data.id ||
      "",

    channel:
      data.channel ||
      currentChannel,

    text,

    createdAt:
      data.createdAt ||
      data.timestamp ||
      Date.now(),

    user: {

      sub:
        user.sub ||
        "",

      name:
        user.name ||
        user.displayName ||
        user.email ||
        data.name ||
        "Minecraft 玩家",

      email:
        user.email ||
        "",

      picture:
        user.picture ||
        user.avatar ||
        data.picture ||
        ""

    },

    attachment

  };

}

/* =========================================================
   Render message
========================================================= */

function renderMessage(
  message,
  shouldScroll
) {

  if (!message) {
    return;
  }

  const normalized =
    normalizeMessage(
      message
    );

  /*
   * 有 ID 才做 DOM 防重複。
   */

  if (
    normalized.id &&
    document.querySelector(
      `[data-message-id="${CSS.escape(normalized.id)}"]`
    )
  ) {

    return;

  }

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "message";

  if (normalized.id) {

    wrapper.dataset.messageId =
      normalized.id;

  }

  const avatar =
    document.createElement("img");

  avatar.className =
    "message-avatar";

  avatar.src =
    normalized.user.picture ||
    fallbackAvatar();

  avatar.alt = "頭像";

  avatar.onerror = () => {

    avatar.src =
      fallbackAvatar();

  };

  const content =
    document.createElement("div");

  content.className =
    "message-content";

  const top =
    document.createElement("div");

  top.className =
    "message-top";

  const name =
    document.createElement("span");

  name.className =
    "message-name";

  name.textContent =
    normalized.user.name ||
    "Minecraft 玩家";

  const time =
    document.createElement("span");

  time.className =
    "message-time";

  time.textContent =
    formatTime(
      normalized.createdAt
    );

  top.appendChild(name);
  top.appendChild(time);

  content.appendChild(top);

  if (normalized.text) {

    const text =
      document.createElement("div");

    text.className =
      "message-text";

    /*
     * textContent 防止訊息內容被當 HTML 執行。
     */

    text.textContent =
      normalized.text;

    content.appendChild(text);

  }

  if (
    normalized.attachment
  ) {

    renderAttachment(
      content,
      normalized.attachment
    );

  }

  wrapper.appendChild(avatar);
  wrapper.appendChild(content);

  messages.appendChild(wrapper);

  if (shouldScroll) {

    /*
     * 新訊息來時只有聊天框往下。
     */

    scrollMessages(false);

  }

}

/* =========================================================
   Attachment
========================================================= */

function renderAttachment(
  container,
  attachment
) {

  const card =
    document.createElement("div");

  card.className =
    "file-card";

  const icon =
    document.createElement("span");

  icon.textContent =
    "📎";

  const link =
    document.createElement("a");

  link.target =
    "_blank";

  link.rel =
    "noopener noreferrer";

  link.href =
    attachment.url ||
    attachment.fileUrl ||
    "#";

  link.textContent =
    attachment.name ||
    attachment.fileName ||
    "檔案";

  card.appendChild(icon);
  card.appendChild(link);

  container.appendChild(card);

}

/* =========================================================
   Time
========================================================= */

function formatTime(value) {

  const date =
    new Date(value);

  if (
    Number.isNaN(
      date.getTime()
    )
  ) {

    return "";

  }

  return (
    `${date.getMonth() + 1}/` +
    `${date.getDate()} ` +
    `${String(date.getHours()).padStart(2,"0")}:` +
    `${String(date.getMinutes()).padStart(2,"0")}`
  );

}

/* =========================================================
   Chat internal scroll
========================================================= */

function scrollMessages(force) {

  if (!messages) {
    return;
  }

  /*
   * 不使用 window.scrollTo。
   * 只控制聊天室自己的 scrollTop。
   */

  if (
    force ||
    messages.scrollHeight >
      messages.clientHeight
  ) {

    messages.scrollTop =
      messages.scrollHeight;

  }

}

/* =========================================================
   Send chat
========================================================= */

chatForm.addEventListener(
  "submit",
  async event => {

    event.preventDefault();

    if (!currentUser) {

      showNotice(
        "請先登入。"
      );

      return;

    }

    const text =
      chatInput.value.trim();

    if (!text) {
      return;
    }

    const button =
      chatForm.querySelector(
        ".send-button"
      );

    button.disabled = true;

    try {

      const response =
        await fetch(
          `${WORKER_URL}/api/chat?channel=${encodeURIComponent(currentChannel)}`,
          {
            method: "POST",

            credentials: "include",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({
                text
              })
          }
        );

      const data =
        await response.json()
          .catch(() => ({}));

      if (!response.ok) {

        throw new Error(
          data.error ||
          `傳送失敗：${response.status}`
        );

      }

      /*
       * Worker REST POST 回傳：
       *
       * {
       *   ok: true,
       *   message: {...}
       * }
       */

      const sentMessage =
        data.message ||
        data.data ||
        null;

      if (sentMessage) {

        renderMessage(
          normalizeMessage(
            sentMessage
          ),
          true
        );

      }

      chatInput.value = "";

      chatInput.focus();

    } catch (error) {

      console.error(
        "Send message error:",
        error
      );

      showNotice(
        error.message ||
        "訊息傳送失敗"
      );

    } finally {

      button.disabled = false;

    }

  }
);

/* Enter 傳送，Shift+Enter 換行目前不做多行 */

chatInput.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      chatForm.requestSubmit();

    }

  }
);

/* =========================================================
   File upload
========================================================= */

fileBtn.addEventListener(
  "click",
  () => {

    if (!currentUser) {

      showNotice(
        "請先登入。"
      );

      return;

    }

    fileInput.click();

  }
);

fileInput.addEventListener(
  "change",
  async () => {

    const file =
      fileInput.files &&
      fileInput.files[0];

    if (!file) {
      return;
    }

    if (
      file.size >
      25 * 1024 * 1024
    ) {

      showNotice(
        "檔案不能超過 25 MB。"
      );

      fileInput.value = "";

      return;

    }

    const oldText =
      fileBtn.textContent;

    fileBtn.disabled = true;

    fileBtn.textContent =
      "⏳ 上傳中...";

    try {

      const formData =
        new FormData();

      formData.append(
        "file",
        file
      );

      const response =
        await fetch(
          `${WORKER_URL}/api/upload?channel=${encodeURIComponent(currentChannel)}`,
          {
            method: "POST",

            credentials: "include",

            body: formData
          }
        );

      const data =
        await response.json()
          .catch(() => ({}));

      if (!response.ok) {

        throw new Error(
          data.error ||
          `上傳失敗：${response.status}`
        );

      }

      /*
       * Worker 上傳 API：
       *
       * {
       *   ok: true,
       *   message: {...},
       *   file: {...}
       * }
       */

      if (data.message) {

        renderMessage(
          normalizeMessage(
            data.message
          ),
          true
        );

      } else if (data.file) {

        renderMessage(
          {
            id:
              "upload-" +
              Date.now(),

            channel:
              currentChannel,

            text: "",

            createdAt:
              Date.now(),

            user:
              currentUser,

            attachment:
              data.file
          },
          true
        );

      }

      showNotice(
        "檔案上傳完成"
      );

    } catch (error) {

      console.error(
        "Upload error:",
        error
      );

      showNotice(
        error.message ||
        "檔案上傳失敗"
      );

    } finally {

      fileBtn.disabled = false;

      fileBtn.textContent =
        oldText;

      fileInput.value = "";

    }

  }
);

/* =========================================================
   Voice UI
========================================================= */

function updateVoiceUI() {

  if (!voiceJoined) {

    voiceStatus.textContent =
      "尚未加入";

    joinVoiceBtn.disabled =
      false;

    leaveVoiceBtn.disabled =
      true;

    muteBtn.disabled =
      true;

    muteBtn.textContent =
      "🎤 麥克風：開";

    return;

  }

  voiceStatus.textContent =
    "已加入大廳";

  joinVoiceBtn.disabled =
    true;

  leaveVoiceBtn.disabled =
    false;

  muteBtn.disabled =
    false;

  muteBtn.textContent =
    voiceMuted
      ? "🔇 麥克風：關"
      : "🎤 麥克風：開";

}

function updateVoiceParticipants() {

  voiceParticipants.innerHTML = "";

  let count =
    voiceUsers.size;

  /*
   * 如果 Worker 沒有回傳 user list，
   * 至少把自己算進去。
   */

  if (
    voiceJoined &&
    voicePeerId &&
    !voiceUsers.has(
      voicePeerId
    )
  ) {

    voiceUsers.set(
      voicePeerId,
      currentUser || {
        name:
          "Minecraft 玩家"
      }
    );

  }

  count =
    voiceUsers.size;

  voiceCount.textContent =
    `${count} 人`;

  if (count === 0) {

    const empty =
      document.createElement("div");

    empty.style.color =
      "#777";

    empty.textContent =
      "尚未有人加入";

    voiceParticipants.appendChild(
      empty
    );

    return;

  }

  for (
    const [id, user] of
    voiceUsers
  ) {

    const row =
      document.createElement("div");

    row.className =
      "participant";

    const avatar =
      document.createElement("img");

    avatar.src =
      user.picture ||
      user.avatar ||
      fallbackAvatar();

    avatar.onerror = () => {

      avatar.src =
        fallbackAvatar();

    };

    const name =
      document.createElement("span");

    name.className =
      "participant-name";

    name.textContent =
      user.name ||
      user.email ||
      "Minecraft 玩家";

    if (
      id === voicePeerId
    ) {

      name.textContent +=
        "（你）";

    }

    row.appendChild(avatar);
    row.appendChild(name);

    voiceParticipants.appendChild(
      row
    );

  }

}

/* =========================================================
   Join Voice
========================================================= */

joinVoiceBtn.addEventListener(
  "click",
  async () => {

    await joinVoice();

  }
);

async function joinVoice() {

  if (!currentUser) {

    showNotice(
      "請先登入才能加入語音。"
    );

    window.location.href =
      `${WORKER_URL}/login`;

    return;

  }

  if (voiceJoined) {
    return;
  }

  try {

    /*
     * 這個 getUserMedia 必須由使用者點擊觸發，
     * 瀏覽器才比較不會阻擋麥克風。
     */

    voiceStream =
      await navigator.mediaDevices.getUserMedia(
        {
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          },
          video: false
        }
      );

    voiceJoined = true;

    voiceMuted = false;

    updateVoiceUI();

    voiceStatus.textContent =
      "正在連線語音伺服器...";

    voiceSocket =
      new WebSocket(
        voiceWsUrl()
      );

    voiceSocket.addEventListener(
      "open",
      () => {

        console.log(
          "VOICE WS connected"
        );

        voiceStatus.textContent =
          "語音已連線";

        /*
         * 某些 Worker 版本會需要 client hello。
         * 傳送目前使用者資料。
         *
         * Worker 若不使用此訊息也沒關係。
         */

        try {

          voiceSocket.send(
            JSON.stringify({
              type: "voice-join",
              user: {
                name:
                  currentUser.name ||
                  currentUser.email ||
                  "Minecraft 玩家",

                email:
                  currentUser.email ||
                  "",

                picture:
                  currentUser.picture ||
                  ""
              }
            })
          );

        } catch (error) {

          console.error(
            "Voice hello error:",
            error
          );

        }

      }
    );

    voiceSocket.addEventListener(
      "message",
      event => {

        handleVoiceMessage(
          event.data
        );

      }
    );

    voiceSocket.addEventListener(
      "close",
      () => {

        console.log(
          "VOICE WS closed"
        );

        if (voiceJoined) {

          voiceStatus.textContent =
            "語音連線已斷開";

        }

      }
    );

    voiceSocket.addEventListener(
      "error",
      error => {

        console.error(
          "VOICE WS error:",
          error
        );

        showNotice(
          "語音 WebSocket 連線失敗"
        );

      }
    );

  } catch (error) {

    console.error(
      "Join voice error:",
      error
    );

    voiceJoined = false;

    updateVoiceUI();

    if (
      error.name ===
      "NotAllowedError"
    ) {

      showNotice(
        "你拒絕了麥克風權限。"
      );

    } else if (
      error.name ===
      "NotFoundError"
    ) {

      showNotice(
        "找不到麥克風。"
      );

    } else {

      showNotice(
        "無法啟用麥克風：" +
        error.message
      );

    }

  }

}

/* =========================================================
   Voice message parser
========================================================= */

function handleVoiceMessage(raw) {

  let data;

  try {

    data =
      typeof raw === "string"
        ? JSON.parse(raw)
        : raw;

  } catch (error) {

    console.error(
      "Voice JSON error:",
      error
    );

    return;

  }

  console.log(
    "VOICE:",
    data
  );

  if (!data) {
    return;
  }

  /*
   * Worker 回傳自己的 peer ID
   */

  if (
    data.peerId &&
    (
      data.type ===
        "voice-state" ||
      data.type ===
        "voice-ready" ||
      data.type ===
        "voice-joined"
    )
  ) {

    voicePeerId =
      data.peerId;

  }

  /* =======================================================
     voice-state
  ======================================================== */

  if (
    data.type ===
    "voice-state"
  ) {

    if (data.peerId) {

      voicePeerId =
        data.peerId;

    }

    voiceUsers.clear();

    const participants =
      data.participants ||
      data.users ||
      data.members ||
      [];

    if (
      Array.isArray(
        participants
      )
    ) {

      for (
        const participant of
        participants
      ) {

        const id =
          participant.peerId ||
          participant.id ||
          participant.sub ||
          "";

        if (!id) {
          continue;
        }

        const user =
          participant.user ||
          participant;

        voiceUsers.set(
          id,
          user
        );

      }

    }

    updateVoiceParticipants();

    /*
     * 最重要的地方：
     *
     * 新加入的人拿到現有玩家列表後，
     * 由「新加入者」主動建立 offer。
     *
     * 這可以避免兩邊同時 offer 造成撞線。
     */

    for (
      const [id] of voiceUsers
    ) {

      if (
        id &&
        id !== voicePeerId
      ) {

        createVoiceOffer(
          id
        );

      }

    }

    return;

  }

  /* =======================================================
     voice-join
  ======================================================== */

  if (
    data.type ===
    "voice-join"
  ) {

    const id =
      getPeerId(data);

    if (!id) {
      return;
    }

    const user =
      getVoiceUser(data);

    voiceUsers.set(
      id,
      user
    );

    updateVoiceParticipants();

    /*
     * 舊玩家不用主動 offer。
     * 新玩家會收到 voice-state，
     * 再由新玩家建立 offer。
     */

    return;

  }

  /* =======================================================
     voice-offer
  ======================================================== */

  if (
    data.type ===
    "voice-offer"
  ) {

    const from =
      getPeerId(data);

    if (!from) {
      return;
    }

    const offer =
      data.offer ||
      data.description;

    if (!offer) {
      return;
    }

    handleVoiceOffer(
      from,
      offer,
      getVoiceUser(data)
    );

    return;

  }

  /* =======================================================
     voice-answer
  ======================================================== */

  if (
    data.type ===
    "voice-answer"
  ) {

    const from =
      getPeerId(data);

    const answer =
      data.answer ||
      data.description;

    if (
      !from ||
      !answer
    ) {

      return;

    }

    const entry =
      voicePeers.get(from);

    if (
      !entry ||
      !entry.pc
    ) {

      return;

    }

    entry.pc
      .setRemoteDescription(
        new RTCSessionDescription(
          answer
        )
      )
      .catch(error => {

        console.error(
          "Set voice answer error:",
          error
        );

      });

    return;

  }

  /* =======================================================
     voice-ice
  ======================================================== */

  if (
    data.type ===
    "voice-ice"
  ) {

    const from =
      getPeerId(data);

    const candidate =
      data.candidate ||
      data.ice;

    if (
      !from ||
      !candidate
    ) {

      return;

    }

    const entry =
      voicePeers.get(from);

    if (
      !entry ||
      !entry.pc
    ) {

      /*
       * ICE 可能比 offer 早到，
       * 先建立 PeerConnection。
       */

      createVoicePeer(
        from,
        getVoiceUser(data)
      );

    }

    const target =
      voicePeers.get(from);

    if (
      !target ||
      !target.pc
    ) {

      return;

    }

    target.pc
      .addIceCandidate(
        new RTCIceCandidate(
          candidate
        )
      )
      .catch(error => {

        console.warn(
          "ICE candidate error:",
          error
        );

      });

    return;

  }

  /* =======================================================
     voice-leave
  ======================================================== */

  if (
    data.type ===
    "voice-leave"
  ) {

    const id =
      getPeerId(data);

    if (id) {

      removeVoicePeer(
        id
      );

      voiceUsers.delete(
        id
      );

      updateVoiceParticipants();

    }

    return;

  }

  /* =======================================================
     兼容部分 Worker 使用 participant-state
  ======================================================== */

  if (
    data.type ===
      "participants" ||
    data.type ===
      "voice-participants"
  ) {

    const participants =
      data.participants ||
      data.users ||
      [];

    if (
      Array.isArray(
        participants
      )
    ) {

      voiceUsers.clear();

      for (
        const participant of
        participants
      ) {

        const id =
          participant.peerId ||
          participant.id ||
          "";

        if (!id) {
          continue;
        }

        voiceUsers.set(
          id,
          participant.user ||
          participant
        );

      }

      updateVoiceParticipants();

    }

  }

}

/* =========================================================
   Create PeerConnection
========================================================= */

function createVoicePeer(
  peerId,
  user
) {

  if (!peerId) {
    return null;
  }

  const existing =
    voicePeers.get(peerId);

  if (existing) {

    if (user) {
      existing.user = user;
    }

    return existing.pc;

  }

  const pc =
    new RTCPeerConnection(
      {
        iceServers:
          ICE_SERVERS
      }
    );

  const entry = {
    pc,
    audio: null,
    user:
      user || {}
  };

  voicePeers.set(
    peerId,
    entry
  );

  /*
   * 加入自己的麥克風。
   */

  if (voiceStream) {

    for (
      const track of
      voiceStream.getTracks()
    ) {

      pc.addTrack(
        track,
        voiceStream
      );

    }

  }

  /*
   * ICE 候選
   */

  pc.addEventListener(
    "icecandidate",
    event => {

      if (
        !event.candidate
      ) {
        return;
      }

      sendVoiceSignal(
        {
          type:
            "voice-ice",

          targetPeerId:
            peerId,

          candidate:
            event.candidate
        }
      );

    }
  );

  /*
   * 遠端音訊。
   *
   * 這裡不是只建立 audio 標籤，
   * 還會把 remote stream 指定給 srcObject。
   */

  pc.addEventListener(
    "track",
    event => {

      console.log(
        "REMOTE AUDIO TRACK:",
        peerId,
        event.streams
      );

      let audio =
        entry.audio;

      if (!audio) {

        audio =
          document.createElement(
            "audio"
          );

        audio.autoplay = true;

        audio.playsInline = true;

        audio.controls = false;

        audio.muted = false;

        audio.volume = 1.0;

        /*
         * 不把 audio 顯示在畫面上。
         */

        audio.style.position =
          "fixed";

        audio.style.width =
          "1px";

        audio.style.height =
          "1px";

        audio.style.opacity =
          "0";

        audio.style.pointerEvents =
          "none";

        audio.setAttribute(
          "aria-hidden",
          "true"
        );

        document.body.appendChild(
          audio
        );

        entry.audio =
          audio;

      }

      if (
        event.streams &&
        event.streams[0]
      ) {

        audio.srcObject =
          event.streams[0];

      } else {

        const stream =
          new MediaStream();

        stream.addTrack(
          event.track
        );

        audio.srcObject =
          stream;

      }

      /*
       * 嘗試立即播放。
       */

      audio
        .play()
        .then(() => {

          console.log(
            "Remote audio playing:",
            peerId
          );

        })
        .catch(error => {

          console.warn(
            "Autoplay blocked:",
            error
          );

        });

    }
  );

  pc.addEventListener(
    "connectionstatechange",
    () => {

      console.log(
        "Voice peer state:",
        peerId,
        pc.connectionState
      );

      if (
        pc.connectionState ===
          "failed" ||
        pc.connectionState ===
          "closed"
      ) {

        removeVoicePeer(
          peerId
        );

      }

    }
  );

  pc.addEventListener(
    "iceconnectionstatechange",
    () => {

      console.log(
        "Voice ICE state:",
        peerId,
        pc.iceConnectionState
      );

    }
  );

  return pc;

}

/* =========================================================
   Create offer
========================================================= */

async function createVoiceOffer(
  peerId
) {

  if (
    !voiceJoined ||
    !voiceSocket ||
    voiceSocket.readyState !==
      WebSocket.OPEN
  ) {

    return;

  }

  if (
    !peerId ||
    peerId === voicePeerId
  ) {

    return;

  }

  try {

    const user =
      voiceUsers.get(
        peerId
      ) || {};

    const pc =
      createVoicePeer(
        peerId,
        user
      );

    if (!pc) {
      return;
    }

    /*
     * 已經有 localDescription
     * 就不要重複 offer。
     */

    if (
      pc.localDescription
    ) {

      return;

    }

    const offer =
      await pc.createOffer();

    await pc.setLocalDescription(
      offer
    );

    sendVoiceSignal(
      {
        type:
          "voice-offer",

        targetPeerId:
          peerId,

        offer:
          pc.localDescription
      }
    );

  } catch (error) {

    console.error(
      "Create voice offer error:",
      error
    );

  }

}

/* =========================================================
   Handle offer
========================================================= */

async function handleVoiceOffer(
  peerId,
  offer,
  user
) {

  try {

    const pc =
      createVoicePeer(
        peerId,
        user
      );

    if (!pc) {
      return;
    }

    await pc.setRemoteDescription(
      new RTCSessionDescription(
        offer
      )
    );

    const answer =
      await pc.createAnswer();

    await pc.setLocalDescription(
      answer
    );

    sendVoiceSignal(
      {
        type:
          "voice-answer",

        targetPeerId:
          peerId,

        answer:
          pc.localDescription
      }
    );

  } catch (error) {

    console.error(
      "Handle voice offer error:",
      error
    );

  }

}

/* =========================================================
   Send voice signal
========================================================= */

function sendVoiceSignal(data) {

  if (
    !voiceSocket ||
    voiceSocket.readyState !==
      WebSocket.OPEN
  ) {

    console.warn(
      "Voice socket not ready:",
      data
    );

    return;

  }

  try {

    voiceSocket.send(
      JSON.stringify(data)
    );

  } catch (error) {

    console.error(
      "Voice send error:",
      error
    );

  }

}

/* =========================================================
   Remove voice peer
========================================================= */

function removeVoicePeer(
  peerId
) {

  const entry =
    voicePeers.get(
      peerId
    );

  if (!entry) {
    return;
  }

  try {

    entry.pc.close();

  } catch {}

  if (
    entry.audio
  ) {

    try {

      entry.audio.pause();

    } catch {}

    try {

      entry.audio.srcObject =
        null;

    } catch {}

    entry.audio.remove();

  }

  voicePeers.delete(
    peerId
  );

}

/* =========================================================
   Leave voice
========================================================= */

leaveVoiceBtn.addEventListener(
  "click",
  () => {

    leaveVoice();

  }
);

function leaveVoice() {

  voiceJoined = false;

  /*
   * 關閉所有 PeerConnection
   */

  for (
    const [peerId] of
    voicePeers
  ) {

    removeVoicePeer(
      peerId
    );

  }

  /*
   * 關閉麥克風。
   */

  if (voiceStream) {

    for (
      const track of
      voiceStream.getTracks()
    ) {

      try {

        track.stop();

      } catch {}

    }

  }

  voiceStream =
    null;

  /*
   * 關閉 WebSocket。
   */

  if (voiceSocket) {

    try {

      voiceSocket.close();

    } catch {}

  }

  voiceSocket =
    null;

  voicePeerId =
    null;

  voiceUsers.clear();

  voiceMuted =
    false;

  updateVoiceParticipants();

  updateVoiceUI();

}

/* =========================================================
   Mute
========================================================= */

muteBtn.addEventListener(
  "click",
  () => {

    if (!voiceStream) {
      return;
    }

    voiceMuted =
      !voiceMuted;

    for (
      const track of
      voiceStream.getAudioTracks()
    ) {

      track.enabled =
        !voiceMuted;

    }

    updateVoiceUI();

  }
);

/* =========================================================
   啟用遠端聲音
========================================================= */

soundBtn.addEventListener(
  "click",
  async () => {

    let success =
      false;

    for (
      const entry of
      voicePeers.values()
    ) {

      if (!entry.audio) {
        continue;
      }

      entry.audio.muted =
        false;

      entry.audio.volume =
        1.0;

      try {

        await entry.audio.play();

        success = true;

      } catch (error) {

        console.warn(
          "Audio play failed:",
          error
        );

      }

    }

    /*
     * 即使目前沒有遠端 audio，
     * 也讓瀏覽器記住這次使用者手勢。
     */

    try {

      const silentContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

      if (
        silentContext.state ===
        "suspended"
      ) {

        await silentContext.resume();

      }

      await silentContext.close();

    } catch {}

    soundBtn.textContent =
      success
        ? "🔊 聲音已啟用"
        : "🔊 聲音已解鎖";

    showNotice(
      "已嘗試啟用遠端聲音"
    );

  }
);

/* =========================================================
   Browser microphone support
========================================================= */

if (
  !navigator.mediaDevices ||
  !navigator.mediaDevices.getUserMedia
) {

  joinVoiceBtn.disabled =
    true;

  voiceStatus.textContent =
    "此瀏覽器不支援麥克風功能";

}

/* =========================================================
   Init
========================================================= */

(async function init() {

  /*
   * 頭像先放 fallback，
   * 避免圖片載入失敗時空白。
   */

  userAvatar.src =
    fallbackAvatar();

  /*
   * 登入狀態。
   */

  await checkLogin();

  /*
   * 預設首頁。
   */

  showPage("home");

})();
</script>
